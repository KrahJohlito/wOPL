name: CI-compile

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      tlb_pc:
        description: "PCSX2 TLB Miss PC address to resolve (for example 0x226578)"
        required: false
        default: "0x226578"
        type: string
  repository_dispatch:
    types: [run_build]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    container: ghcr.io/ps2homebrew/ps2homebrew@sha256:207523ad98f17fd406afa7dd0c6cfe10730627545cbe45247f0bd73c8a66c376
    steps:
      - name: Install required dependencies
        run: |
          apk update
          apk add --no-cache \
            make \
            git \
            python3 \
            gcc \
            g++ \
            libtool \
            automake \
            bison \
            flex \
            texinfo \
            gawk \
            wget \
            curl \
            zip

      - name: git checkout
        uses: actions/checkout@v6

      - run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git fetch --prune --unshallow

      - name: Compile -> make clean release
        run: make --trace clean release

      - name: Resolve PCSX2 TLB address
        if: ${{ success() }}
        shell: sh
        env:
          TLB_PC: ${{ github.event.inputs.tlb_pc || github.event.client_payload.tlb_pc || '0x226578' }}
        run: |
          set -eu

          ELF="wopl.elf"
          REPORT="TLB_REPORT.txt"
          NM_FILE="TLB_NM.txt"

          echo "Requested TLB PC: ${TLB_PC}"

          case "${TLB_PC}" in
            0x[0-9a-fA-F]*|[0-9]*)
              ;;
            *)
              echo "ERROR: TLB_PC must be a decimal or hexadecimal address."
              exit 1
              ;;
          esac

          # The release target normally leaves the unstripped linker ELF here.
          # If it does not, rebuild the same source without packing so symbols
          # and source-line information are available for the lookup.
          if [ ! -f "${ELF}" ]; then
            echo "wopl.elf was not left by the release target; rebuilding NOT_PACKED=1 for symbols."
            make --trace NOT_PACKED=1
          fi

          if [ ! -f "${ELF}" ]; then
            echo "ERROR: Could not find or build ${ELF}."
            find . -maxdepth 2 -type f \( -iname '*.elf' -o -iname '*.map' \) -print || true
            exit 1
          fi

          ADDR2LINE="$(command -v mips64r5900el-ps2-elf-addr2line || true)"
          OBJDUMP="$(command -v mips64r5900el-ps2-elf-objdump || true)"
          NM="$(command -v mips64r5900el-ps2-elf-nm || true)"
          READELF="$(command -v mips64r5900el-ps2-elf-readelf || true)"

          if [ -z "${ADDR2LINE}" ] || [ -z "${OBJDUMP}" ] || [ -z "${NM}" ] || [ -z "${READELF}" ]; then
            echo "ERROR: Required PS2 EE binutils were not found."
            echo "addr2line=${ADDR2LINE}"
            echo "objdump=${OBJDUMP}"
            echo "nm=${NM}"
            echo "readelf=${READELF}"
            exit 1
          fi

          START_HEX="$(python3 -c 'import sys; pc=int(sys.argv[1], 0); print(hex(max(0, pc-0x100)))' "${TLB_PC}")"
          PREV_HEX="$(python3 -c 'import sys; pc=int(sys.argv[1], 0); print(hex(max(0, pc-4)))' "${TLB_PC}")"
          NEXT_HEX="$(python3 -c 'import sys; pc=int(sys.argv[1], 0); print(hex(pc+4))' "${TLB_PC}")"
          STOP_HEX="$(python3 -c 'import sys; pc=int(sys.argv[1], 0); print(hex(pc+0x100))' "${TLB_PC}")"

          "${NM}" -n -C "${ELF}" > "${NM_FILE}"

          {
            echo "============================================================"
            echo "wOPL PCSX2 TLB LOOKUP"
            echo "============================================================"
            echo "Commit:       ${GITHUB_SHA}"
            echo "Repository:   ${GITHUB_REPOSITORY}"
            echo "Ref:          ${GITHUB_REF}"
            echo "ELF:          ${ELF}"
            echo "TLB PC:       ${TLB_PC}"
            echo "Window:       ${START_HEX} .. ${STOP_HEX}"
            echo "ELF SHA-256:  $(sha256sum "${ELF}" | cut -d' ' -f1)"
            echo

            echo "============================================================"
            echo "ADDR2LINE: PC - 4"
            echo "============================================================"
            "${ADDR2LINE}" -a -f -C -i -e "${ELF}" "${PREV_HEX}" || true
            echo

            echo "============================================================"
            echo "ADDR2LINE: EXACT TLB PC"
            echo "============================================================"
            "${ADDR2LINE}" -a -f -C -i -e "${ELF}" "${TLB_PC}" || true
            echo

            echo "============================================================"
            echo "ADDR2LINE: PC + 4"
            echo "============================================================"
            "${ADDR2LINE}" -a -f -C -i -e "${ELF}" "${NEXT_HEX}" || true
            echo

            echo "============================================================"
            echo "NEAREST LINKER SYMBOLS"
            echo "============================================================"
            python3 - "${TLB_PC}" "${NM_FILE}" <<'PY'
          import sys

          pc = int(sys.argv[1], 0)
          symbols = []

          with open(sys.argv[2], "r", errors="replace") as handle:
              for raw_line in handle:
                  parts = raw_line.strip().split(None, 2)
                  if len(parts) < 3:
                      continue

                  try:
                      address = int(parts[0], 16)
                  except ValueError:
                      continue

                  symbols.append((address, parts[1], parts[2]))

          before = [symbol for symbol in symbols if symbol[0] <= pc]
          after = [symbol for symbol in symbols if symbol[0] > pc]

          if before:
              address, symbol_type, name = before[-1]
              print(f"Previous/containing: 0x{address:08x} {symbol_type} {name} (+0x{pc-address:x})")
          else:
              print("Previous/containing: not found")

          if after:
              address, symbol_type, name = after[0]
              print(f"Next:                0x{address:08x} {symbol_type} {name} (-0x{address-pc:x})")
          else:
              print("Next:                not found")
          PY
            echo

            echo "============================================================"
            echo "DISASSEMBLY AND SOURCE AROUND ${TLB_PC}"
            echo "============================================================"
            "${OBJDUMP}" \
              -d \
              -S \
              -l \
              -C \
              --start-address="${START_HEX}" \
              --stop-address="${STOP_HEX}" \
              "${ELF}" || true
            echo

            echo "============================================================"
            echo "ELF SECTIONS"
            echo "============================================================"
            "${READELF}" -S "${ELF}" || true
          } 2>&1 | tee "${REPORT}"

          echo
          echo "TLB lookup complete. The full report is also in ${REPORT}."

      - name: Upload TLB lookup report and symbol ELF
        if: ${{ success() }}
        uses: actions/upload-artifact@v6
        with:
          name: WOPL-TLB-SYMBOLS
          if-no-files-found: error
          path: |
            TLB_REPORT.txt
            TLB_NM.txt
            wopl.elf
            wopl.map

      - name: Create detailed changelog
        run: sh ./make_changelog.sh

      - name: Prepend release badges to DETAILED_CHANGELOG
        shell: sh
        run: |
          set -eu

          # Ensure file exists even if generator didn't create it (avoid failing uploads).
          [ -f DETAILED_CHANGELOG ] || : > DETAILED_CHANGELOG

          TMP="$(mktemp)"
          cp -f DETAILED_CHANGELOG "$TMP"

          cat > DETAILED_CHANGELOG << 'EOF'
          [![CI](https://github.com/ps2homebrew/wOPL/actions/workflows/compilation.yml/badge.svg?branch=wOPL-base)](https://github.com/ps2homebrew/wOPL/actions/workflows/compilation.yml)
          [![Codacy Badge](https://app.codacy.com/project/badge/Grade/8ee1eccd035c464eb0a985486b3f71bd)](https://app.codacy.com/gh/ps2homebrew/wOPL/dashboard?utm_source=gh&utm_medium=referral&utm_content=&utm_campaign=Badge_grade)
          [![Discord](https://img.shields.io/discord/1275875800318476381?style=plastic&logo=discord&logoColor=blue&label=Discord&labelColor=%23faf9f6&color=blue)](https://tinyurl.com/PS2SPACE)
          [![Downloads](https://img.shields.io/github/downloads/ps2homebrew/wOPL/total?style=plastic&logo=playstation&logoColor=blue&label=%7C%20UNOFFICIAL%20OPEN%20PS2%20LOADER%20%7C%20TOTAL%20DOWNLOADS%3A&labelColor=%23faf9f6&color=blue)](https://github.com/ps2homebrew/wOPL/releases)

          ---

          EOF

          # Append the original changelog content after the badges block.
          cat "$TMP" >> DETAILED_CHANGELOG
          rm -f "$TMP"

      - name: Upload release artifact ELF
        if: ${{ success() }}
        uses: actions/upload-artifact@v6
        with:
          name: WOPNPS2LD
          path: |
            WOPNPS2LD-*.ELF

      - name: Upload release artifact info
        if: ${{ success() }}
        uses: actions/upload-artifact@v6
        with:
          name: INFO
          path: |
            DETAILED_CHANGELOG
            CREDITS
            LICENSE
            README.md

  build-variants:
    strategy:
      fail-fast: false
      matrix:
        extra: [EXTRA_FEATURES=0, EXTRA_FEATURES=1]
        gsm: [GSM=0, GSM=1]
        cheat: [CHEAT=0, CHEAT=1]
        pademu: [PADEMU=0, PADEMU=1]
    runs-on: ubuntu-22.04
    container: ghcr.io/ps2homebrew/ps2homebrew@sha256:207523ad98f17fd406afa7dd0c6cfe10730627545cbe45247f0bd73c8a66c376
    steps:
      - name: Install required dependencies
        run: |
          apk update
          apk add --no-cache \
            make \
            git \
            python3 \
            gcc \
            g++ \
            libtool \
            automake \
            bison \
            flex \
            texinfo \
            gawk \
            wget \
            curl \
            zip

      - name: git checkout
        uses: actions/checkout@v6

      - run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git fetch --prune --unshallow


      - name: Get version
        run: |
          echo "wOPL_VERSION=$(make woplversion)" >> $GITHUB_ENV

      - name: Compile -> make ${{ matrix.extra }} ${{ matrix.pademu }} ${{ matrix.gsm }} ${{ matrix.cheat }} NOT_PACKED=1
        run: |
          make --trace ${{ matrix.pademu }} ${{ matrix.extra }} ${{ matrix.gsm }} ${{ matrix.cheat }} NOT_PACKED=1
          mv wopl.elf WOPNPS2LD-${{ env.wOPL_VERSION }}-${{ matrix.pademu }}-${{ matrix.extra }}-${{ matrix.gsm }}-${{ matrix.cheat }}.ELF

      - name: Create detailed changelog
        run: sh ./make_changelog.sh

      - name: Upload variants artifact ELF
        uses: actions/upload-artifact@v6
        with:
          name: WOPNPS2LD-VARIANTS ${{ matrix.pademu }}  ${{ matrix.gsm }} ${{ matrix.cheat }} ${{ matrix.extra }}
          path: WOPNPS2LD*.ELF

  merge-variants:
    runs-on: ubuntu-22.04
    needs: build-variants
    steps:
      - name: Merge Artifacts
        uses: actions/upload-artifact/merge@v6
        with:
          name: WOPNPS2LD-VARIANTS
          pattern: WOPNPS2LD-VARIANTS*
          delete-merged: true

  build-lang:
    runs-on: ubuntu-22.04
    container: ghcr.io/ps2homebrew/ps2homebrew@sha256:207523ad98f17fd406afa7dd0c6cfe10730627545cbe45247f0bd73c8a66c376
    steps:
      - name: Install required dependencies
        run: |
          apk update
          apk add --no-cache \
            make \
            git \
            python3 \
            gcc \
            g++ \
            libtool \
            automake \
            bison \
            flex \
            texinfo \
            gawk \
            wget \
            curl \
            zip

      - name: git checkout
        uses: actions/checkout@v6

      - run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git fetch --prune --unshallow

      - name: Compile -> make download_lng languages
        run: make --trace download_lng languages

      - name: Create artifact
        run: sh ./lng_pack.sh

      - name: Upload release artifact
        if: ${{ success() }}
        uses: actions/upload-artifact@v6
        with:
          name: WOPNPS2LD-LANGS
          path: |
            WOPNPS2LD-LANGS-*.zip

  build-debug:
    strategy:
      fail-fast: false
      matrix:
        debug: [iopcore_debug, ingame_debug, eesio_debug, DTL_T10000=1]
        container_commit: [":main"]
    runs-on: ubuntu-22.04
    container: ghcr.io/ps2homebrew/ps2homebrew@sha256:207523ad98f17fd406afa7dd0c6cfe10730627545cbe45247f0bd73c8a66c376
    steps:
      - name: Install required dependencies
        run: |
          apk update
          apk add --no-cache \
            make \
            git \
            python3 \
            gcc \
            g++ \
            libtool \
            automake \
            bison \
            flex \
            texinfo \
            gawk \
            wget \
            curl \
            zip

      - name: git checkout
        uses: actions/checkout@v6

      - run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git fetch --prune --unshallow

      - name: Get version
        run: |
          echo "wOPL_VERSION=$(make woplversion)" >> $GITHUB_ENV
          SHORT_COMMIT="${{ matrix.container_commit }}"
          SHORT_COMMIT=${SHORT_COMMIT: -4}
          echo "SHORT_COMMIT=$SHORT_COMMIT" >> $GITHUB_ENV

      - name: Compile -> make debug
        run: |
          make ${{ matrix.debug }} --trace
          mv wopl.elf wopl-${{ matrix.debug }}-${{ env.wOPL_VERSION }}-${{ env.SHORT_COMMIT }}.elf

      - name: Upload variants artifact ELF
        uses: actions/upload-artifact@v6
        with:
          name: wopl-${{ matrix.debug }}-${{ env.wOPL_VERSION }}-${{ env.SHORT_COMMIT }}
          path: wopl-*.elf

  merge-debug:
    runs-on: ubuntu-22.04
    needs: build-debug
    steps:
      - name: Merge Artifacts
        uses: actions/upload-artifact/merge@v6
        with:
          name: WOPNPS2LD-DEBUG
          pattern: wopl-*
          delete-merged: true

  release:
    needs: [build, merge-variants, build-lang, merge-debug]
    runs-on: ubuntu-22.04
    # Create a NEW prerelease + NEW tag on every run (never on PRs).
    if: github.event_name != 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Generate version + unique prerelease tag
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          wOPL_VERSION="$(make woplversion)"
          SHORT_SHA="${GITHUB_SHA::7}"
          TS="$(date -u +'%Y%m%d-%H%M%S')"
          TAG="${wOPL_VERSION}-${TS}-${GITHUB_RUN_NUMBER}-${SHORT_SHA}"
          echo "wOPL_VERSION=${wOPL_VERSION}" >> "$GITHUB_ENV"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "name=Double Unofficial OPL ${wOPL_VERSION} (${TS} ${SHORT_SHA})" >> "$GITHUB_OUTPUT"

      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Install packer tools (7z)
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full

      - name: Prepare release assets
        shell: bash
        run: |
          set -euo pipefail
          echo "Preparing prerelease ${wOPL_VERSION}"

          # Copy INFO into folders where it exists
          cp -v INFO/* WOPNPS2LD/ || true
          cp -v INFO/* WOPNPS2LD-VARIANTS/ || true
          cp -v INFO/* WOPNPS2LD-LANGS/ || true

          # Put raw main ELF on the release as WOPNPS2LD.ELF
          MAIN_ELF="$(find WOPNPS2LD -maxdepth 1 -type f -name 'WOPNPS2LD-*.ELF' | head -n 1)"
          if [ -z "${MAIN_ELF}" ]; then
            echo "ERROR: Could not find main ELF in WOPNPS2LD/ (expected WOPNPS2LD-*.ELF)"
            ls -la WOPNPS2LD || true
            exit 1
          fi
          cp -f "${MAIN_ELF}" WOPNPS2LD.ELF

          # Create archives
          7z a -t7z "WOPNPS2LD-${wOPL_VERSION}.7z" WOPNPS2LD/*
          7z a -t7z "WOPNPS2LD-VARIANTS-${wOPL_VERSION}.7z" WOPNPS2LD-VARIANTS/* || true
          7z a -t7z "WOPNPS2LD-LANGS-${wOPL_VERSION}.7z" WOPNPS2LD-LANGS/* || true
          7z a -t7z "WOPNPS2LD-DEBUG-${wOPL_VERSION}.7z" WOPNPS2LD-DEBUG/* || true

          # Stable filenames
          cp -f "WOPNPS2LD-${wOPL_VERSION}.7z" WOPNPS2LD.7z
          cp -f "WOPNPS2LD-VARIANTS-${wOPL_VERSION}.7z" WOPNPS2LD-VARIANTS.7z || true
          cp -f "WOPNPS2LD-LANGS-${wOPL_VERSION}.7z" WOPNPS2LD-LANGS.7z || true
          cp -f "WOPNPS2LD-DEBUG-${wOPL_VERSION}.7z" WOPNPS2LD-DEBUG.7z || true

      - name: Create GitHub prerelease (new tag every run)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.name }}
          prerelease: true
          generate_release_notes: true
          target_commitish: ${{ github.sha }}
          body: |
            [![CI](https://github.com/ps2homebrew/wOPL/actions/workflows/compilation.yml/badge.svg?branch=wOPL-base)](https://github.com/ps2homebrew/wOPL/actions/workflows/compilation.yml)
            [![Codacy Badge](https://app.codacy.com/project/badge/Grade/8ee1eccd035c464eb0a985486b3f71bd)](https://app.codacy.com/gh/ps2homebrew/wOPL/dashboard?utm_source=gh&utm_medium=referral&utm_content=&utm_campaign=Badge_grade)
            [![Discord](https://img.shields.io/discord/1275875800318476381?style=flat&logo=Discord)](https://tinyurl.com/PS2SPACE)
            [![Downloads](https://img.shields.io/github/downloads/ps2homebrew/wOPL/total?style=plastic&logo=playstation&logoColor=blue&label=%7C%20DOUBLE%20UNOFFICIAL%20OPEN%20PS2%20LOADER%20%7C%20TOTAL%20DOWNLOADS%3A&labelColor=%23faf9f6&color=blue)](https://github.com/ps2homebrew/wOPL/releases)

          files: |
            WOPNPS2LD.ELF
            WOPNPS2LD.7z
            WOPNPS2LD-VARIANTS.7z
            WOPNPS2LD-LANGS.7z
            WOPNPS2LD-DEBUG.7z
            INFO/DETAILED_CHANGELOG
            INFO/README.md
            INFO/LICENSE
            INFO/CREDITS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
